[tasks.update]
description = "Update Julia environments"
run = """
{% for env in [".","benchmark","examples","test","docs"] %}
  julia --project={{env}} -e 'import Pkg; Pkg.update()'
{% endfor %}
"""

[tasks.test]
description = "Run tests for Albatross.jl"
usage = """
arg "[args]" var=#true help="Test ARGS" default=""
"""
run = """
julia --project -e 'import Pkg; Pkg.test(; test_args=ARGS)' ${usage_args}
"""

[tasks.benchmark]
description = "Run benchmark using AirspeedVelocity.jl"
usage = """
flag "--rev <rev>" help="Revisions to test" default="main,dirty"
flag "--mode <mode>" help="Table mode(s)" default="time,memory"
flag "--filter <filter>" help="Filter the benchmarks to run" default=""
flag "--output-dir <output-dir>" help="Output directory" default="/tmp"
flag "--no-ratio" help="Do not show the ratio"
"""
run = """
benchpkg \
  --rev {{ usage.rev }} \
  --script benchmark/benchmarks.jl \
  --output-dir {{ usage.output_dir }} \
  --dont-print \
  --add \
    'https://github.com/gabrielbdsantos/ConcreteStructs.jl#main',\
    'https://github.com/gabrielbdsantos/AirfoilDefinitions.jl#v0.1.3',\
    'https://github.com/gabrielbdsantos/NNFoil.jl#v0.3.3'
  {% if usage.filter %} --filter {{ usage.filter }} {% endif %}

benchpkgtable \
  --rev {{ usage.rev }} \
  --input-dir {{ usage.output_dir }} \
  --mode {{ usage.mode }} \
  {% if not usage.ratio -%} --ratio {%- endif -%}
"""
